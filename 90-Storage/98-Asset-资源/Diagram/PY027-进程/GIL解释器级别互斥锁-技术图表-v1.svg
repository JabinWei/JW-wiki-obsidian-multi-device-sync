<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="38" fill="white" font-size="18" font-weight="700" text-anchor="middle">GIL 是解释器级别的互斥锁</text>
  <text x="480" y="58" fill="#94a3b8" font-size="11" text-anchor="middle">每个 CPython 解释器实例拥有独立的 GIL，进程间互不干扰</text>

  <!-- Top: Single .py file -->
  <rect x="350" y="80" width="260" height="36" rx="6" fill="#0f172a"/>
  <rect x="350" y="80" width="260" height="36" rx="6" fill="rgba(59,130,246,0.2)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="480" y="103" fill="white" font-size="12" font-weight="600" text-anchor="middle">multiprocessing.Process(target=fn)</text>

  <!-- Fork arrows -->
  <line x1="420" y1="116" x2="240" y2="162" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <line x1="540" y1="116" x2="720" y2="162" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="290" y="138" fill="#a78bfa" font-size="9">fork() / spawn()</text>
  <text x="580" y="138" fill="#a78bfa" font-size="9">fork() / spawn()</text>

  <!-- ===== LEFT: Process A ===== -->
  <rect x="40" y="168" width="400" height="195" rx="10" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="240" y="192" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">进程 A — OS 进程</text>

  <!-- Interpreter box A -->
  <rect x="70" y="208" width="340" height="65" rx="8" fill="#0f172a"/>
  <rect x="70" y="208" width="340" height="65" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="240" y="232" fill="white" font-size="13" font-weight="600" text-anchor="middle">CPython 解释器（独立实例）</text>

  <!-- GIL lock inside A -->
  <rect x="170" y="245" width="140" height="24" rx="12" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow-amber)"/>
  <text x="240" y="261" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">🔒 GIL_A</text>

  <!-- Thread in A -->
  <rect x="100" y="285" width="130" height="30" rx="6" fill="#0f172a"/>
  <rect x="100" y="285" width="130" height="30" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="165" y="304" fill="white" font-size="10" font-weight="500" text-anchor="middle">线程 1 执行中</text>

  <rect x="250" y="285" width="130" height="30" rx="6" fill="#0f172a"/>
  <rect x="250" y="285" width="130" height="30" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="315" y="304" fill="#94a3b8" font-size="10" text-anchor="middle">线程 2 等待 GIL</text>

  <!-- ===== RIGHT: Process B ===== -->
  <rect x="520" y="168" width="400" height="195" rx="10" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="720" y="192" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">进程 B — 另一个 OS 进程</text>

  <!-- Interpreter box B -->
  <rect x="550" y="208" width="340" height="65" rx="8" fill="#0f172a"/>
  <rect x="550" y="208" width="340" height="65" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="720" y="232" fill="white" font-size="13" font-weight="600" text-anchor="middle">CPython 解释器（独立实例）</text>

  <!-- GIL lock inside B -->
  <rect x="650" y="245" width="140" height="24" rx="12" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5" filter="url(#glow-amber)"/>
  <text x="720" y="261" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">🔒 GIL_B</text>

  <!-- Thread in B -->
  <rect x="580" y="285" width="130" height="30" rx="6" fill="#0f172a"/>
  <rect x="580" y="285" width="130" height="30" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="645" y="304" fill="white" font-size="10" font-weight="500" text-anchor="middle">线程 1 执行中</text>

  <rect x="730" y="285" width="130" height="30" rx="6" fill="#0f172a"/>
  <rect x="730" y="285" width="130" height="30" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="795" y="304" fill="#94a3b8" font-size="10" text-anchor="middle">线程 2 等待 GIL</text>

  <!-- GIL-independent indicator between processes -->
  <rect x="370" y="240" width="220" height="28" rx="14" fill="rgba(251,191,36,0.15)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="480" y="259" fill="#fbbf24" font-size="10" font-weight="500" text-anchor="middle">两个 GIL 隔离在不同解释器中</text>

  <!-- ===== BOTTOM: CPU cores ===== -->
  <rect x="40" y="395" width="415" height="45" rx="6" fill="#0f172a"/>
  <rect x="40" y="395" width="415" height="45" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
  <text x="247" y="415" fill="white" font-size="10" font-weight="600" text-anchor="middle">CPU 核心 0 ← 进程 A</text>
  <text x="247" y="430" fill="#94a3b8" font-size="9" text-anchor="middle">两个进程真正同时运行</text>

  <rect x="505" y="395" width="415" height="45" rx="6" fill="#0f172a"/>
  <rect x="505" y="395" width="415" height="45" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="712" y="415" fill="white" font-size="10" font-weight="600" text-anchor="middle">CPU 核心 1 ← 进程 B</text>
  <text x="712" y="430" fill="#94a3b8" font-size="9" text-anchor="middle">各自持有独立的 GIL</text>

  <!-- Connect processes to CPUs -->
  <line x1="240" y1="363" x2="247" y2="393" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <line x1="720" y1="363" x2="712" y2="393" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- ===== Legend ===== -->
  <rect x="40" y="465" width="880" height="55" rx="6" fill="#0f172a"/>
  <rect x="40" y="465" width="880" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <text x="70" y="488" fill="#94a3b8" font-size="9" font-weight="600">结论</text>
  <text x="70" y="505" fill="#94a3b8" font-size="9">GIL 是解释器内部的锁，不是操作系统全局锁。多进程 = 启动多个独立的 CPython 解释器，各管各的 GIL，互不影响。开销大的根源也在这。</text>
</svg>
