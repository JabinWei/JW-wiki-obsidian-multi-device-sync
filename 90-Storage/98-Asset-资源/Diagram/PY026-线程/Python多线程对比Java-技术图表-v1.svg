<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'PingFang SC', 'Noto Sans SC', sans-serif; }
  </style>

  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>

    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-emerald">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="480" y="42" fill="white" font-size="18" font-weight="700" text-anchor="middle">Python (CPython) vs Java / C++  多线程执行模型对比</text>

  <!-- ===== LEFT SIDE: Python ===== -->
  <rect x="30" y="65" width="440" height="310" rx="10" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="250" y="88" fill="#fb7185" font-size="12" font-weight="600" text-anchor="middle">Python (CPython) — GIL 串行执行</text>

  <!-- CPU box -->
  <rect x="70" y="105" width="360" height="45" rx="6" fill="#0f172a"/>
  <rect x="70" y="105" width="360" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="250" y="125" fill="white" font-size="11" font-weight="600" text-anchor="middle">CPython 解释器（单进程）</text>
  <text x="250" y="141" fill="#94a3b8" font-size="9" text-anchor="middle">GIL 互斥锁</text>

  <!-- Threads -->
  <rect x="70" y="200" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="70" y="200" width="160" height="50" rx="6" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="150" y="222" fill="white" font-size="11" font-weight="600" text-anchor="middle">线程 1（计算任务）</text>
  <text x="150" y="239" fill="#94a3b8" font-size="9" text-anchor="middle">等待 GIL...</text>

  <rect x="270" y="200" width="160" height="50" rx="6" fill="#0f172a"/>
  <rect x="270" y="200" width="160" height="50" rx="6" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="350" y="222" fill="white" font-size="11" font-weight="600" text-anchor="middle">线程 2（计算任务）</text>
  <text x="350" y="239" fill="#94a3b8" font-size="9" text-anchor="middle">等待 GIL...</text>

  <!-- GIL gate -->
  <rect x="170" y="155" width="140" height="35" rx="17" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="240" y="176" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">🔒 GIL 闸门</text>

  <!-- Arrows: threads → GIL gate -->
  <line x1="150" y1="200" x2="200" y2="192" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>
  <line x1="350" y1="200" x2="280" y2="192" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrow-rose)"/>

  <!-- Arrow: GIL gate → interpreter -->
  <line x1="240" y1="175" x2="240" y2="155" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Execution timeline -->
  <rect x="70" y="270" width="360" height="45" rx="6" fill="#0f172a"/>
  <rect x="70" y="270" width="173" height="45" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <rect x="243" y="270" width="187" height="45" rx="6" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="1"/>
  <text x="250" y="298" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">线程1 ████ 线程2 ████</text>
  <text x="250" y="311" fill="#94a3b8" font-size="8" text-anchor="middle">串行交替，同一时刻只有 1 个线程执行</text>

  <!-- GIL label -->
  <text x="250" y="345" fill="#fbbf24" font-size="10" font-weight="500" text-anchor="middle">⚠ 8 核 CPU，计算任务只能用 1 核</text>


  <!-- ===== RIGHT SIDE: Java/C++ ===== -->
  <rect x="490" y="65" width="440" height="310" rx="10" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="710" y="88" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle">Java / C++ / Go / Rust — 真并行执行</text>

  <!-- OS box -->
  <rect x="530" y="105" width="360" height="45" rx="6" fill="#0f172a"/>
  <rect x="530" y="105" width="360" height="45" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="710" y="125" fill="white" font-size="11" font-weight="600" text-anchor="middle">操作系统线程调度器</text>
  <text x="710" y="141" fill="#94a3b8" font-size="9" text-anchor="middle">跨 CPU 核心并行调度</text>

  <!-- CPU cores column -->
  <text x="530" y="180" fill="#94a3b8" font-size="9">CPU 核心：</text>

  <!-- Core 0 -->
  <rect x="530" y="192" width="170" height="35" rx="6" fill="#0f172a"/>
  <rect x="530" y="192" width="170" height="35" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="615" y="214" fill="white" font-size="10" font-weight="600" text-anchor="middle">Core 0 ← 线程 1 ██████</text>

  <!-- Core 1 -->
  <rect x="530" y="237" width="170" height="35" rx="6" fill="#0f172a"/>
  <rect x="530" y="237" width="170" height="35" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="615" y="259" fill="white" font-size="10" font-weight="600" text-anchor="middle">Core 1 ← 线程 2 ██████</text>

  <!-- Core 2 -->
  <rect x="720" y="192" width="170" height="35" rx="6" fill="#0f172a"/>
  <rect x="720" y="192" width="170" height="35" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="805" y="214" fill="white" font-size="10" font-weight="600" text-anchor="middle">Core 2 ← 线程 3 ██████</text>

  <!-- Core 3 -->
  <rect x="720" y="237" width="170" height="35" rx="6" fill="#0f172a"/>
  <rect x="720" y="237" width="170" height="35" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="805" y="259" fill="white" font-size="10" font-weight="600" text-anchor="middle">Core 3 ← 线程 4 ██████</text>

  <!-- Arrows from OS to cores -->
  <line x1="710" y1="150" x2="615" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <line x1="710" y1="150" x2="805" y2="190" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- Result label -->
  <rect x="530" y="290" width="360" height="50" rx="6" fill="#0f172a"/>
  <rect x="530" y="290" width="360" height="50" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="1"/>
  <text x="710" y="312" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">4 线程 × 4 核 = 真正同时执行</text>
  <text x="710" y="328" fill="#94a3b8" font-size="8" text-anchor="middle">计算任务接近 N 倍加速</text>

  <text x="710" y="345" fill="#34d399" font-size="10" font-weight="500" text-anchor="middle">✅ 8 核 CPU，计算任务可用满 8 核</text>


  <!-- ===== BOTTOM: Common Ground ===== -->
  <rect x="30" y="395" width="900" height="80" rx="8" fill="#0f172a"/>
  <rect x="30" y="395" width="900" height="80" rx="8" fill="rgba(59,130,246,0.15)" stroke="#60a5fa" stroke-width="1"/>
  <text x="480" y="420" fill="#60a5fa" font-size="12" font-weight="600" text-anchor="middle">💡 IO 密集型任务：两者都受益</text>
  <text x="480" y="442" fill="#94a3b8" font-size="10" text-anchor="middle">Python：IO 等待时 GIL 自动释放 → 其他线程获取 GIL 继续跑 → 多线程有效加速 IO 任务</text>
  <text x="480" y="460" fill="#94a3b8" font-size="10" text-anchor="middle">Java/C++：IO 等待时线程被操作系统挂起 → 其他线程自然调度到 CPU → 多线程同样有效</text>

  <!-- ===== Conclusion bar ===== -->
  <rect x="30" y="495" width="900" height="45" rx="6" fill="#0f172a"/>
  <rect x="30" y="495" width="900" height="45" rx="6" fill="rgba(76,29,149,0.25)" stroke="#a78bfa" stroke-width="1"/>
  <text x="480" y="516" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">核心差异不在 API，在「执行模型」——Python 多线程串行执行字节码，Java/C++/Go/Rust 多线程并行执行</text>
  <text x="480" y="532" fill="#94a3b8" font-size="9" text-anchor="middle">使用建议：Python 计算密集 → multiprocessing / C 扩展释放 GIL | Python IO 密集 → threading ✅ | Java/C++ → threading ✅</text>

  <!-- ===== Legend ===== -->
  <rect x="600" y="555" width="330" height="55" rx="6" fill="#0f172a"/>
  <rect x="600" y="555" width="330" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
  <text x="620" y="576" fill="#94a3b8" font-size="9" font-weight="600">图例</text>
  <rect x="620" y="585" width="12" height="12" rx="2" fill="rgba(136,19,55,0.5)" stroke="#fb7185" stroke-width="1"/>
  <text x="638" y="595" fill="#94a3b8" font-size="8">Python (GIL 串行)</text>
  <rect x="760" y="585" width="12" height="12" rx="2" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1"/>
  <text x="778" y="595" fill="#94a3b8" font-size="8">Java/C++ (真并行)</text>
  <rect x="890" y="585" width="12" height="12" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
  <text x="908" y="595" fill="#94a3b8" font-size="8">共性</text>
</svg>
